<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#078b58"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sudi Mampir"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="description" content="Sudi Mampir — Sistem Kasir Multi-Cabang">
  <title>Sudi Mampir</title><link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="brand-mark" id="loginBrandMark">SM</div><p class="eyebrow">SISTEM KASIR & MANAJEMEN USAHA</p>
      <h1>Sudi <span>Mampir</span></h1><p class="muted">Silakan masuk untuk melanjutkan</p>
      <form id="loginForm">
        <label>Username<input id="username" autocomplete="username" required placeholder="Masukkan username"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></label>
        <button class="btn primary full" type="submit">Masuk</button>
      </form><div id="loginError" class="error"></div>
      <small class="muted center">Akses aman untuk Owner dan Karyawan</small>
    </div>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-row"><div class="brand-mark small" id="sidebarBrandMark">SM</div><div><b>Sudi Mampir</b><small>POS & Management</small></div></div>
      <nav id="sideNav">
        <button class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Statistik</span></button>
        <button class="nav-item" data-page="branches" data-owner><i data-lucide="store"></i><span>Cabang</span></button>
        <button class="nav-item" data-page="users" data-owner><i data-lucide="users"></i><span>Pengguna</span></button>
        <button class="nav-item" data-page="purchaseList" data-purchase-access><i data-lucide="clipboard-list"></i><span>Daftar Belanja</span></button>
        <button class="nav-item" data-page="salesList"><i data-lucide="chart-column"></i><span>Daftar Penjualan</span></button>
        <button class="nav-item" data-page="products"><i data-lucide="package"></i><span>Produk</span></button>
        <button class="nav-item" data-page="menu"><i data-lucide="utensils"></i><span>Daftar Menu</span></button>
        <button class="nav-item" data-page="paymentSettings" data-owner><i data-lucide="settings-2"></i><span>Pengaturan Pembayaran & Printer</span></button>
      </nav>
      <button id="logoutBtn" class="logout"><i data-lucide="log-out"></i> Keluar</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn-light home-return-btn topbar-home-btn" id="homeBtn" type="button"><i data-lucide="house"></i><span>Home</span></button>
        <div class="header-actions"><div class="user-chip"><div class="avatar" id="avatar">O</div><div><b id="userName">Owner</b><small id="userRole">OWNER</small></div></div></div>
        <div class="page-heading-hidden" aria-hidden="true"><span id="pageLabel">HOME</span><h2 id="pageTitle">Home</h2></div>
      </header>
      <section id="content" class="content"></section>
    </main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi utama">
      <div class="bottom-nav-track">
        <button class="active" data-home><i data-lucide="house"></i><small>Home</small></button>
        <button data-page="menu"><i data-lucide="utensils"></i><small>Menu</small></button>
        <button data-page="salesList"><i data-lucide="receipt-text"></i><small>Penjualan</small></button>
        <button data-page="purchaseList" data-purchase-access><i data-lucide="shopping-basket"></i><small>Belanja</small></button>
        <button data-page="products"><i data-lucide="package"></i><small>Produk</small></button>
        <button data-page="branches" data-owner><i data-lucide="store"></i><small>Cabang</small></button>
        <button data-page="users" data-owner><i data-lucide="users"></i><small>Pengguna</small></button>
        <button data-page="paymentSettings" data-owner><i data-lucide="settings-2"></i><small>Pengaturan</small></button>
      </div>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <!-- Aplikasi dijalankan lebih dahulu agar halaman login tidak menunggu CDN ikon. -->
  <script src="/app.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" onload="if(window.lucide&&window.lucide.createIcons){window.lucide.createIcons({attrs:{'stroke-width':2}})}"></script>
  <script async src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</body></html>
