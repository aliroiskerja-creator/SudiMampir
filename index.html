<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#078b58"><meta name="description" content="Sudi Mampir — Sistem Kasir Multi-Cabang">
  <title>Sudi Mampir</title><link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="brand-mark" id="loginBrandMark">SM</div><p class="eyebrow">SISTEM KASIR & MANAJEMEN USAHA</p>
      <h1>Sudi <span>Mampir</span></h1><p class="muted">Silakan masuk untuk melanjutkan</p>
      <form id="loginForm">
        <label>Username<input id="username" autocomplete="username" required placeholder="Masukkan username"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></label>
        <button class="btn primary full" type="submit">Masuk</button>
      </form><div id="loginError" class="error"></div>
      <small class="muted center">Akses aman untuk Owner dan Karyawan</small>
    </div>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-row"><div class="brand-mark small" id="sidebarBrandMark">SM</div><div><b>Sudi Mampir</b><small>POS & Management</small></div></div>
      <nav id="sideNav">
        <button class="nav-item active" data-page="dashboard">🏠 <span>Statistik</span></button>
        <button class="nav-item" data-page="branches" data-owner>🏬 <span>Cabang</span></button>
        <button class="nav-item" data-page="users" data-owner>👥 <span>Pengguna</span></button>
        <button class="nav-item" data-page="purchaseList" data-purchase-access>🧾 <span>Daftar Belanja</span></button>
        <button class="nav-item" data-page="salesList">📊 <span>Daftar Penjualan</span></button>
        <button class="nav-item" data-page="products">📦 <span>Produk</span></button>
        <button class="nav-item" data-page="menu">🍽️ <span>Daftar Menu</span></button>
        <button class="nav-item" data-page="paymentSettings" data-owner>⚙️ <span>Pengaturan Pembayaran & Printer</span></button>
      </nav>
      <button id="logoutBtn" class="logout">↪ Keluar</button>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="eyebrow">SUDI MAMPIR / <span id="pageLabel">DASHBOARD</span></span><h2 id="pageTitle">Dashboard</h2></div>
        <div class="user-chip"><div class="avatar" id="avatar">O</div><div><b id="userName">Owner</b><small id="userRole">OWNER</small></div></div>
      </header>
      <section id="content" class="content"></section>
    </main>
    <nav class="bottom-nav" id="bottomNav">
      <button class="active" data-page="dashboard"><span>🏠</span><small>Statistik</small></button>
      <button data-page="menu"><span>🍽️</span><small>Menu</small></button>
      <button data-page="purchaseList" data-purchase-access><span>🧾</span><small>Riwayat</small></button>
      <button data-page="branches" data-owner><span>🏬</span><small>Cabang</small></button>
      <button data-page="users" data-owner><span>👤</span><small>User</small></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="/app.js"></script>
</body></html>
