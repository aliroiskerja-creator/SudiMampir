<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#078b58"><meta name="description" content="Sudi Mampir — Sistem Kasir Multi-Cabang">
  <title>Sudi Mampir</title><link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">SM</div><p class="eyebrow">SISTEM KASIR & MANAJEMEN USAHA</p>
      <h1>Sudi <span>Mampir</span></h1><p class="muted">Silakan masuk untuk melanjutkan</p>
      <form id="loginForm">
        <label>Username<input id="username" autocomplete="username" required placeholder="Masukkan username"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></label>
        <button class="btn primary full" type="submit">Masuk</button>
      </form><div id="loginError" class="error"></div>
      <small class="muted center">Akses aman untuk Owner dan Karyawan</small>
    </div>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-row"><div class="brand-mark small">SM</div><div><b>Sudi Mampir</b><small>POS & Management</small></div></div>
      <nav id="sideNav">
        <button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-page="branches" data-owner>▦ <span>Cabang</span></button>
        <button class="nav-item" data-page="users" data-owner>♙ <span>Pengguna</span></button>
        <button class="nav-item" data-page="products">▣ <span>Menu Jual</span></button>
        <button class="nav-item" data-page="ingredients" data-owner>🥬 <span>Bahan Baku</span></button>
        <button class="nav-item" data-page="recipes" data-owner>▤ <span>Resep Menu</span></button>
        <button class="nav-item" data-page="stock">▤ <span>Stok Cabang</span></button>
      </nav>
      <button id="logoutBtn" class="logout">↪ Keluar</button>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="eyebrow">SUDI MAMPIR / <span id="pageLabel">DASHBOARD</span></span><h2 id="pageTitle">Dashboard</h2></div>
        <div class="user-chip"><div class="avatar" id="avatar">O</div><div><b id="userName">Owner</b><small id="userRole">OWNER</small></div></div>
      </header>
      <section id="content" class="content"></section>
    </main>
    <nav class="bottom-nav" id="bottomNav">
      <button class="active" data-page="dashboard"><span>⌂</span><small>Home</small></button>
      <button data-page="products"><span>▣</span><small>Menu</small></button>
      <button data-page="ingredients" data-owner><span>🥬</span><small>Bahan</small></button>
      <button data-page="recipes" data-owner><span>▤</span><small>Resep</small></button>
      <button data-page="stock"><span>▤</span><small>Stok</small></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body></html>
